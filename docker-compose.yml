version: '3.8'

services:
  # Master coordinator service
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: master
    container_name: darkstream-master
    hostname: master
    ports:
      - "8080:8080"
    volumes:
      # Source videos to convert
      - videos_storage:/mnt/storage/videos
      # Converted output
      - converted_storage:/mnt/storage/converted
      # Database persistence (the image's config stores jobs.db here)
      - master_db:/app/db
      # To use a custom config, mount it over the built-in one and keep
      # database.path on the /app/db volume:
      # - ./config-master.yaml:/app/config.yaml:ro
    networks:
      - darkstream
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker 1 - GPU enabled
  worker1:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: darkstream-worker-1
    hostname: worker1
    # Fetch all settings from the master (remote configuration mode). The
    # example config file points at localhost, which is not the master here.
    command: ["-url", "http://master:8080", "-id", "worker-1"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # Local working cache for downloads and conversions
      - worker1_tmp:/tmp/converter-cache
    networks:
      - darkstream
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped
    # GPU support - requires NVIDIA Docker runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Worker 2 - Optional second worker
  worker2:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: darkstream-worker-2
    hostname: worker2
    command: ["-url", "http://master:8080", "-id", "worker-2"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - worker2_tmp:/tmp/converter-cache
    networks:
      - darkstream
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped
    # GPU support - requires NVIDIA Docker runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CLI service for monitoring (optional)
  cli:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    container_name: darkstream-cli
    volumes:
      - videos_storage:/mnt/storage/videos
    networks:
      - darkstream
    depends_on:
      master:
        condition: service_healthy
    # Run as interactive only
    stdin_open: true
    tty: true
    entrypoint: /bin/sh

volumes:
  # Persistent storage for videos
  videos_storage:
    driver: local
  
  # Converted output
  converted_storage:
    driver: local

  # Database storage for master
  master_db:
    driver: local
  
  # Temporary work directories for workers
  worker1_tmp:
    driver: local
  
  worker2_tmp:
    driver: local

networks:
  darkstream:
    driver: bridge
