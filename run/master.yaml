server:
  port: 8080
  host: 0.0.0.0
  api_key: ""
  tls_cert: ""
  tls_key: ""

scanner:
  root_path: /root/projects/Darkstream/run/videos
  video_extensions:
    - .mp4
    - .mkv
    - .mov
    - .avi
    - .flv
    - .webm
    - .m4v
  output_base: /root/projects/Darkstream/run/converted
  recursive_depth: -1
  scan_interval: 1m
  min_file_size: 0
  max_file_size: 0
  skip_hidden_files: true
  skip_hidden_dirs: true
  replace_source: false
  detect_duplicates: true
  enable_watch: true

database:
  path: /root/projects/Darkstream/run/db/jobs.db

notifications:
  webhook_url: ""
  events:
    - completed
    - failed

conversion:
  target_resolution: 1280x720
  codec: h264
  bitrate: 2M
  preset: ultrafast
  audio_codec: aac
  audio_bitrate: 128k
  output_format: mp4

worker_defaults:
  concurrency: 2
  heartbeat_interval: 10s
  job_check_interval: 3s
  job_timeout: 30m
  max_api_requests_per_min: 120
  max_backoff_interval: 10s
  initial_backoff_interval: 1s
  download_timeout: 10m
  upload_timeout: 10m
  max_cache_size: 10737418240
  cache_cleanup_age: 24h
  bandwidth_limit: 0
  enable_resume_download: true
  use_vulkan: false
  ffmpeg_timeout: 30m
  log_level: info
  log_format: text

logging:
  level: info
  format: text
  output_path: /root/projects/Darkstream/run/master.log
