# DarkStream secrets. Replace the placeholder values before applying:
#
#   MASTER_API_KEY=$(openssl rand -hex 32)
#   WORKER_TOKEN_1=$(openssl rand -hex 32)
#
# The same master API key must be present in the master ConfigMap
# (server.api_key) and in the worker ConfigMap (master.api_key).
# Worker tokens are optional per-worker bearer tokens; when set, a worker
# presenting its token is authenticated as "worker:<id>" on /api/worker/*
# (useful for the audit log). Keep them in sync with server.worker_tokens
# in the master config.
apiVersion: v1
kind: Secret
metadata:
  name: darkstream-secrets
  namespace: darkstream
type: Opaque
stringData:
  master-api-key: "REPLACE_WITH_MASTER_API_KEY"
  worker-token-1: "REPLACE_WITH_WORKER_TOKEN_1"
