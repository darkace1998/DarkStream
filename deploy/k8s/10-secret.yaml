# DarkStream secrets. Replace the placeholder values before applying:
#
#   MASTER_API_KEY=$(openssl rand -hex 32)
#   WORKER_TOKEN_1=$(openssl rand -hex 32)
#
# The master reads master-api-key via the DARKSTREAM_API_KEY env var (not from
# the ConfigMap). Worker tokens are optional per-worker bearer tokens; when
# set, a worker presenting its token is authenticated as "worker:<id>" on
# /api/worker/* and bound to that worker id. Keep them in sync with
# server.worker_tokens in the master config (20-configmap-master.yaml).
#
# darkstream-tls holds the master's TLS cert/key (the master refuses to start
# with an API key over plain HTTP). Generate e.g. with:
#   openssl req -x509 -newkey rsa:2048 -keyout tls.key -out tls.crt -days 365 -nodes -subj "/CN=darkstream-master"
# For production, use cert-manager and a separate Secret of type kubernetes.io/tls.
apiVersion: v1
kind: Secret
metadata:
  name: darkstream-secrets
  namespace: darkstream
type: Opaque
stringData:
  master-api-key: "REPLACE_WITH_MASTER_API_KEY"
  worker-token-1: "REPLACE_WITH_WORKER_TOKEN_1"
---
apiVersion: v1
kind: Secret
metadata:
  name: darkstream-tls
  namespace: darkstream
type: kubernetes.io/tls
stringData:
  tls.crt: "REPLACE_WITH_PEM_CERT"
  tls.key: "REPLACE_WITH_PEM_KEY"
