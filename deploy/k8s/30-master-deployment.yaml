apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkstream-master
  namespace: darkstream
  labels:
    app.kubernetes.io/name: darkstream
    app.kubernetes.io/component: master
spec:
  replicas: 1 # the SQLite job database is single-writer; do not scale out
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: darkstream
      app.kubernetes.io/component: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkstream
        app.kubernetes.io/component: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: master
          image: darkstream:latest # build with: docker build -t darkstream:latest --target master .
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/darkstream/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DARKSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: darkstream-secrets
                  key: master-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/darkstream/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
              readOnly: true
            - name: converted
              mountPath: /media/converted
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: darkstream-master-config
        - name: data
          persistentVolumeClaim:
            claimName: darkstream-master-data
        - name: media
          hostPath:
            path: /srv/media
            type: Directory
        - name: converted
          hostPath:
            path: /srv/media/converted
            type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: darkstream-master-data
  namespace: darkstream
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: darkstream-master
  namespace: darkstream
  labels:
    app.kubernetes.io/name: darkstream
    app.kubernetes.io/component: master
spec:
  selector:
    app.kubernetes.io/name: darkstream
    app.kubernetes.io/component: master
  ports:
    - name: http
      port: 8080
      targetPort: http
