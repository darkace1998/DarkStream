# Prometheus Operator ServiceMonitor for the master's /metrics endpoint.
# Drop this file if you do not run the Prometheus Operator; the pod annotations
# in 30-master-deployment.yaml cover classic prometheus scrape configs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: darkstream-master
  namespace: darkstream
  labels:
    app.kubernetes.io/name: darkstream
    release: prometheus # adjust to your Prometheus Operator release label
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: darkstream
      app.kubernetes.io/component: master
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
